name: Deploy Next.js Application

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: nextjs-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy on Self-Hosted Runner
    runs-on: self-hosted

    defaults:
      run:
        shell: bash

    env:
      APP_DIR: /var/www/my-nextjs-app
      APP_NAME: next-app
      PORT: 3000
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git

    steps:

      # 1. Setup Node.js on the runner
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 2. Ensure system dependencies are present
      - name: Setup Deployment Environment
        run: |
          set -e

          echo "Node.js: $(node -v)"
          echo "NPM:     $(npm -v)"

          if ! command -v pm2 >/dev/null 2>&1; then
            echo "Installing PM2..."
            sudo npm install -g pm2
          fi

          echo "PM2: $(pm2 -v)"

          sudo apt-get update -qq
          sudo apt-get install -y -qq git curl

      # 3. Stop and remove the existing PM2 process
      - name: Stop Existing Application
        run: |
          if pm2 describe "$APP_NAME" >/dev/null 2>&1; then
            echo "Stopping $APP_NAME..."
            pm2 stop  "$APP_NAME" || true
            pm2 delete "$APP_NAME" || true
          else
            echo "No existing PM2 process found — skipping."
          fi

      # 4. Delete the previous application folder
      - name: Delete Previous Application Directory
        run: |
          set -e

          if [ -d "$APP_DIR" ]; then
            echo "Removing $APP_DIR..."
            sudo rm -rf "$APP_DIR"
          fi

          sudo mkdir -p "$APP_DIR"
          sudo chown -R "$(whoami):$(whoami)" "$APP_DIR"

          echo "Fresh directory ready: $APP_DIR"

      # 5. Clone the repository at the commit that triggered this run
      - name: Clone Repository
        run: |
          set -e

          echo "Cloning $REPO_URL at ${{ github.sha }}..."

          git clone "$REPO_URL" "$APP_DIR"

          cd "$APP_DIR"
          git checkout "${{ github.sha }}"

          echo "Cloned successfully."

      # 6. Write environment variables
      - name: Configure Environment
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -e

          cd "$APP_DIR"

          umask 077

          cat > .env.production <<EOF
          NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_URL
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$SUPABASE_KEY
          EOF

          chmod 600 .env.production

          echo ".env.production written."

      # 7. Install dependencies
      # @tailwindcss/postcss and tailwindcss are in dependencies (not devDependencies)
      # so npm ci alone is enough. --include=dev is kept as a safety net.
      - name: Install Dependencies
        run: |
          set -e

          cd "$APP_DIR"

          npm ci --include=dev

          echo "Verifying critical build dependencies..."
          npm ls @tailwindcss/postcss tailwindcss

          echo "Dependencies installed."

      # 8. Build the application
      - name: Build Next.js Application
        run: |
          set -e

          cd "$APP_DIR"

          NODE_ENV=production npm run build

          if [ ! -d "$APP_DIR/.next" ]; then
            echo "ERROR: .next directory not found after build!"
            exit 1
          fi

          echo "Build succeeded."

      # 9. Start the application with PM2 on port 3000
      - name: Start Application with PM2
        run: |
          set -e

          cd "$APP_DIR"

          NODE_ENV=production pm2 start npm \
            --name  "$APP_NAME" \
            --cwd   "$APP_DIR" \
            --time  \
            -- start -- -p "$PORT"

          pm2 save

          echo "Application started on port $PORT."

      # 10. Health check — wait up to 60 s for the server to respond
      - name: Application Health Check
        run: |
          set -e

          echo "Waiting for Next.js to become ready..."

          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$PORT" -o /dev/null; then
              echo "Health check passed on attempt $i."
              pm2 status
              exit 0
            fi
            echo "  Attempt $i/30 — retrying in 2 s..."
            sleep 2
          done

          echo "ERROR: Application did not respond after 60 s."
          pm2 logs "$APP_NAME" --lines 100 --nostream || true
          exit 1

      # 11. Deployment summary
      - name: Deployment Summary
        if: success()
        run: |
          echo "======================================"
          echo "       DEPLOYMENT SUCCESSFUL"
          echo "======================================"
          echo "Application : $APP_NAME"
          echo "Directory   : $APP_DIR"
          echo "Port        : $PORT"
          echo "Commit      : ${{ github.sha }}"
          echo "Node.js     : $(node -v)"
          echo "PM2         : $(pm2 -v)"
          echo "======================================"
          pm2 list

      # 12. Failure diagnostics
      - name: Deployment Failure Diagnostics
        if: failure()
        run: |
          echo "======================================"
          echo "       DEPLOYMENT FAILED"
          echo "======================================"
          pm2 status || true
          pm2 logs "$APP_NAME" --lines 100 --nostream || true
          echo "======================================"
