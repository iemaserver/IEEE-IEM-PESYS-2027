
name: Deploy Next.js Application

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: nextjs-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy on Self-Hosted Runner
    runs-on: self-hosted

    defaults:
      run:
        shell: bash

    env:
      APP_DIR: /var/www/my-nextjs-app
      APP_NAME: next-app
      PORT: 3000

    steps:

      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # 3. Setup deployment environment
      - name: Setup Deployment Environment
        run: |
          set -e

          echo "Node.js version:"
          node -v

          echo "NPM version:"
          npm -v

          if ! command -v pm2 >/dev/null 2>&1; then
            echo "Installing PM2..."
            sudo npm install -g pm2
          fi

          echo "PM2 version:"
          pm2 -v

          sudo apt-get update
          sudo apt-get install -y rsync curl

      # 4. Prepare application directory
      - name: Prepare Application Directory
        run: |
          set -e

          sudo mkdir -p "$APP_DIR"
          sudo chown -R "$(whoami):$(whoami)" "$APP_DIR"

      # 5. Copy application files
      - name: Deploy Application Files
        run: |
          set -e

          rsync -av --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env' \
            --exclude='.env.local' \
            "$GITHUB_WORKSPACE/" "$APP_DIR/"

      # 6. Configure environment variables
      - name: Configure Environment
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -e

          cd "$APP_DIR"

          umask 077

          cat > .env.production <<EOF
          NEXT_PUBLIC_SUPABASE_URL=$SUPABASE_URL
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$SUPABASE_KEY
          EOF

          chmod 600 .env.production

      # 7. Install dependencies
      - name: Install Dependencies
        run: |
          set -e

          cd "$APP_DIR"

          # @tailwindcss/postcss and tailwindcss are in dependencies (not devDependencies)
          # so a plain npm ci is sufficient. --include=dev kept as a safety net for
          # any other build-time packages that may be added later.
          npm ci --include=dev

          echo "Verifying critical build dependencies..."

          npm ls @tailwindcss/postcss tailwindcss

          echo "Dependencies installed successfully."

      # 8. Build application
      - name: Build Next.js Application
        run: |
          set -e

          cd "$APP_DIR"

          export NODE_ENV=production

          npm run build

          if [ ! -d ".next" ]; then
            echo "Production build directory missing!"
            exit 1
          fi

          echo "Next.js build completed successfully."

      # 9. Stop previous PM2 process
      - name: Stop Existing Application
        run: |
          if pm2 describe "$APP_NAME" >/dev/null 2>&1; then
            echo "Stopping existing application..."
            pm2 delete "$APP_NAME"
          else
            echo "No existing application found."
          fi

      # 10. Start application
      - name: Start Application with PM2
        run: |
          set -e

          cd "$APP_DIR"

          NODE_ENV=production pm2 start npm \
            --name "$APP_NAME" \
            --cwd "$APP_DIR" \
            --time \
            -- start -- -H 127.0.0.1 -p "$PORT"

          echo "Application started."

      # 11. Health check
      - name: Application Health Check
        run: |
          set -e

          echo "Waiting for Next.js server..."

          for i in {1..30}; do

            if curl -fsS \
              "http://127.0.0.1:$PORT" \
              -o /dev/null; then

              echo "Application is healthy!"

              pm2 save
              pm2 status

              exit 0
            fi

            echo "Waiting... Attempt $i/30"
            sleep 2

          done

          echo "Application health check failed!"

          pm2 describe "$APP_NAME" || true

          pm2 logs "$APP_NAME" \
            --lines 100 \
            --nostream || true

          exit 1

      # 12. Deployment summary
      - name: Deployment Summary
        if: success()
        run: |
          echo "======================================"
          echo "       DEPLOYMENT SUCCESSFUL"
          echo "======================================"

          echo "Application : $APP_NAME"
          echo "Directory   : $APP_DIR"
          echo "Port        : $PORT"
          echo "Node.js     : $(node -v)"
          echo "PM2         : $(pm2 -v)"

          echo "======================================"

          pm2 list

      # 13. Failure diagnostics
      - name: Deployment Failure Diagnostics
        if: failure()
        run: |
          echo "======================================"
          echo "       DEPLOYMENT FAILED"
          echo "======================================"

          pm2 status || true

          pm2 logs "$APP_NAME" \
            --lines 100 \
            --nostream || true

          echo "======================================"
