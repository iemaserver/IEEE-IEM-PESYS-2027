
name: Deploy Next.js Application

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  deploy:
    name: Deploy on Self-Hosted Runner
    runs-on: self-hosted

    defaults:
      run:
        shell: bash

    env:
      APP_DIR: /var/www/my-nextjs-app
      APP_NAME: next-app
      PORT: 3000

    steps:
      # 1. Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 3. Ensure npm and PM2 are available
      - name: Install Dependencies
        run: |
          set -e

          if ! command -v node >/dev/null 2>&1; then
            echo "Node.js is missing"
            exit 1
          fi

          if ! command -v npm >/dev/null 2>&1; then
            echo "npm is missing"
            exit 1
          fi

          if ! command -v pm2 >/dev/null 2>&1; then
            sudo npm install -g pm2
          fi

          echo "Node: $(node -v)"
          echo "NPM: $(npm -v)"
          echo "PM2: $(pm2 -v)"

      # 4. Prepare deployment directory
      - name: Prepare Application Directory
        run: |
          sudo mkdir -p "$APP_DIR"
          sudo chown -R "$(whoami):$(whoami)" "$APP_DIR"

      # 5. Copy application files
      - name: Copy Application
        run: |
          rsync -av --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            "$GITHUB_WORKSPACE/" "$APP_DIR/"

      # 6. Create environment file
      - name: Configure Environment Variables
        run: |
          cd "$APP_DIR"

          cat > .env.production <<EOF
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          EOF

      # 7. Install application dependencies
      - name: Install Application Dependencies
        run: |
          cd "$APP_DIR"
          npm ci

      # 8. Build application
      - name: Build Application
        run: |
          cd "$APP_DIR"
          npm run build

      # 9. Restart application using PM2
      - name: Deploy with PM2
        run: |
          cd "$APP_DIR"

          pm2 delete "$APP_NAME" || true

          pm2 start npm \
            --name "$APP_NAME" \
            -- start -- -p "$PORT"

          pm2 save

      # 10. Verify deployment
      - name: Verify Deployment
        run: |
          pm2 list
          pm2 describe "$APP_NAME"
